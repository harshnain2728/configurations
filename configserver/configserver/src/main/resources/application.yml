spring:
  application:
    name: configserver
  profiles:
    active: git
    #active: native
  cloud:
    config:
      server:
        #native:
          #search-locations: classpath:/config
        git:
          uri: "https://github.com/harshnain2728/eazybytes.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true


server:
  port: 8071

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}


